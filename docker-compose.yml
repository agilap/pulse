services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    hostname: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-not-a-real-secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
